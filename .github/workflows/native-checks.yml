name: Native update checks
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Java 11 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Select Java 17 for Gradle
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Test and build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        run: >-
          xcodebuild -project 'ios/Invoice Mini.xcodeproj'
          -scheme 'Invoice Mini' -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/InvoiceMiniDerived CODE_SIGNING_ALLOWED=NO build
